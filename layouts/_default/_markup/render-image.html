{{- $ext := lower (path.Ext .Destination) -}}
{{- if and (eq $ext ".svg") (not (hasPrefix .Destination "/")) -}}
  <img
    class="article-svg"
    src="{{ .Destination | safeURL }}"
    alt="{{ .Text }}"
    {{ with .Title }}title="{{ . }}"{{ end }}
  />
{{- else -}}
  <img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" {{ with .Title }}title="{{ . }}"{{ end }} />
{{- end -}}
