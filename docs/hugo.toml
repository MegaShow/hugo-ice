baseURL = 'https://docs.icytown.com/hugo-ice'
title = 'Hugo Ice'
theme = 'hugo-ice'

defaultContentLanguage = 'zh-cn'
disableKinds = ['rss', 'sitemap', 'taxonomy', 'term']
hasCJKLanguage = true

[languages]
  [languages.zh-cn]
    label = '简体中文'
    weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'vs'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
    ordered = false

[security]
  allowContent = ['markdown', 'html']

[menu]
  [[menu.header]]
    name = '首页'
    url = '/'
    weight = 1
  [[menu.header]]
    name = '快速上手'
    url = '/getting-started'
    weight = 2
  [[menu.header]]
    name = 'GitHub'
    url = 'https://github.com/megashow/hugo-ice'
    weight = 100

[params]
  favicon = 'favicon.svg'
  [params.author]
    name = 'MegaShow'
  [params.article]
    hidePublishDate = true
  [params.footer]
    since = 2022
  [params.highlight]
    style = 'vs'
